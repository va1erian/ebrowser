name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      # See ci.yml's build-linux job for why this list is short: litehtml's
      # `cc`-crate build only needs a C/C++ compiler + pkg-config, libssl-dev
      # is for native-tls (unrelated to Servo/litehtml), and libdbus-1-dev is
      # for keyring's Linux secret-service backend (also unrelated). The long
      # Servo-era list (cmake, nasm, clang/llvm-dev, X11/Vulkan/Mesa/GL,
      # freetype/harfbuzz/glib, gstreamer, python3) is gone.
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev libdbus-1-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ebrowser-linux
          path: target/release/ebrowser

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release
        env:
          RUST_BACKTRACE: 1

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path ebrowser-windows
          Copy-Item "target/release/ebrowser.exe" -Destination "ebrowser-windows/"
          Get-ChildItem "target/release/*.dll" | Copy-Item -Destination "ebrowser-windows/" -ErrorAction SilentlyContinue
          Compress-Archive -Path "ebrowser-windows/*" -DestinationPath "ebrowser-windows.zip"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ebrowser-windows
          path: ebrowser-windows.zip

  create-release:
    name: Create Release
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download Linux Artifact
        uses: actions/download-artifact@v4
        with:
          name: ebrowser-linux
          path: ./artifacts/linux
          
      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: ebrowser-windows
          path: ./artifacts/windows

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./artifacts/linux/ebrowser
            ./artifacts/windows/ebrowser-windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
