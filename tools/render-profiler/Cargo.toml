[package]
name = "render-profiler"
version = "0.0.0"
edition = "2021"
publish = false
description = "Sampling profiler for litehtml render passes (Windows / MSVC / x64). See docs/PERFORMANCE.md."

# Not a member of the main workspace: it is Windows-only, and is built on its
# own (with a short CARGO_TARGET_DIR, see the docs) when someone needs a profile.
[workspace]

[dependencies]
# Same source as the main workspace's `litehtml` dependency.
litehtml = { git = "https://github.com/va1erian/litehtml-rs.git", features = ["pixbuf", "email"] }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Kernel",
    "Win32_System_LibraryLoader",
] }

[profile.release]
# Symbols are the whole point: dbghelp resolves C++ and Rust frames from the PDB.
debug = true
