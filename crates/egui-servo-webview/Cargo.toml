[package]
name = "egui-servo-webview"
description = "An egui widget that embeds the Servo web engine. Internal to this workspace."
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
egui.workspace = true
servo.workspace = true
dpi.workspace = true
raw-window-handle.workspace = true
euclid.workspace = true
keyboard-types.workspace = true
url.workspace = true
log.workspace = true
base64.workspace = true

# Optional: convenience constructor that takes an eframe CreationContext.
eframe = { workspace = true, optional = true }

[features]
default = ["eframe"]
eframe = ["dep:eframe"]
